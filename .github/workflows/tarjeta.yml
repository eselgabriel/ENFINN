# Genera los pases de Google Wallet y Apple Wallet con las credenciales
# guardadas como "secrets" del repositorio y publica la página en GitHub Pages.
name: Publicar tarjeta

on:
  push:
    branches: [claude/tarjeta-wallet-fue, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cargar credenciales (desde los secrets)
        env:
          GOOGLE_WALLET_SA_JSON: ${{ secrets.GOOGLE_WALLET_SA_JSON }}
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_WWDR_BASE64: ${{ secrets.APPLE_WWDR_BASE64 }}
        run: |
          mkdir -p certs
          if [ -n "$GOOGLE_WALLET_SA_JSON" ]; then
            printf '%s' "$GOOGLE_WALLET_SA_JSON" > certs/google-service-account.json
            echo "Google Wallet: credencial cargada"
          else
            echo "Google Wallet: falta el secret GOOGLE_WALLET_SA_JSON (se omite)"
          fi
          if [ -n "$APPLE_P12_BASE64" ] && [ -n "$APPLE_WWDR_BASE64" ]; then
            printf '%s' "$APPLE_P12_BASE64" | base64 -d > certs/pass.p12
            printf '%s' "$APPLE_WWDR_BASE64" | base64 -d > certs/AppleWWDRCAG4.cer
            echo "Apple Wallet: certificados cargados"
          else
            echo "Apple Wallet: faltan APPLE_P12_BASE64 / APPLE_WWDR_BASE64 (se omite)"
          fi

      - name: Generar tarjeta y pases
        env:
          GOOGLE_WALLET_ISSUER_ID: ${{ vars.GOOGLE_WALLET_ISSUER_ID || secrets.GOOGLE_WALLET_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_PASS_TYPE_ID: ${{ vars.APPLE_PASS_TYPE_ID }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: python3 scripts/build.py

      - name: Borrar credenciales
        if: always()
        run: rm -rf certs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
